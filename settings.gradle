// A normal clone (or GitHub ZIP download) does not include submodule contents.
// Fail before Gradle reports an opaque variant/configuration matching error.
if (!new File(settingsDir, 'ServerProxy/build.gradle').isFile()) {
    throw new GradleException(
        'ServerProxy sources are missing. From the repository root, run: ' +
        'git submodule update --init --recursive, then sync Gradle again. ' +
        'If you downloaded a ZIP, clone the repository with Git instead.'
    )
}

include ':app'

include ':ServerProxy'
project(':ServerProxy').projectDir = new File('ServerProxy')
